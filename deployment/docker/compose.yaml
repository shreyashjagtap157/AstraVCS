services:
  astravcs:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile
    ports: ["127.0.0.1:8080:8080"]
    volumes: ["astra-data:/var/lib/astravcs"]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
volumes: {astra-data: {}}
