apiVersion: apps/v1
kind: Deployment
metadata: {name: astravcs-ha}
spec:
  replicas: 3
  selector: {matchLabels: {app: astravcs-ha}}
  template:
    metadata: {labels: {app: astravcs-ha}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001}
      containers:
      - name: astravcs
        image: astravcs/astravcs:0.49.0
        args: ["--mode","shared","--root","/tmp/astravcs-node","--host","0.0.0.0","--port","8080"]
        env:
        - {name: ASTRA_DATABASE_URL, valueFrom: {secretKeyRef: {name: astravcs-ha, key: database-url}}}
        - {name: ASTRA_S3_BUCKET, valueFrom: {secretKeyRef: {name: astravcs-ha, key: s3-bucket}}}
        - {name: ASTRA_S3_ENDPOINT, valueFrom: {secretKeyRef: {name: astravcs-ha, key: s3-endpoint}}}
        - {name: ASTRA_S3_REGION, valueFrom: {secretKeyRef: {name: astravcs-ha, key: s3-region}}}
        - {name: ASTRA_WORKER_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
        ports: [{containerPort: 8080}]
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
        readinessProbe: {httpGet: {path: /v1/health, port: 8080}, initialDelaySeconds: 2, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /v1/health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: astravcs-ha}
spec: {selector: {app: astravcs-ha}, ports: [{port: 80, targetPort: 8080}]}
